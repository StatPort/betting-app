<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turneringsbetting</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1220;
    --card: #1b1f33;
    --accent: #ffb703;
    --accent-2: #fb8500;
    --text: #f4f4f9;
    --muted: #a6a8c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e2240, #0a0c17 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 24px;
    text-align: center;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  select, input[type="text"], input[type="range"] {
    width: 100%;
    font-size: 1rem;
  }

  select, input[type="text"] {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #3a3f5c;
    background: #262b47;
    color: var(--text);
    appearance: none;
    font-family: inherit;
  }

  select:focus, input[type="text"]:focus {
    outline: 2px solid var(--accent);
  }

  .amount-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .amount-value {
    min-width: 64px;
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
  }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a1a1a;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button:not(:disabled):hover {
    transform: translateY(-2px);
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 14px;
  }

  .bets-panel {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
    background: var(--card);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .bets-panel h2 {
    font-size: 1.1rem;
    margin: 0 0 16px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #3a3f5c;
  }

  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
  }

  td.amount-cell {
    text-align: right;
    font-weight: 700;
    color: var(--accent);
  }

  .empty-bets {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 8px 0;
  }

  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  #fireworks-canvas {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 10;
  }

  #celebration-text {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 11;
    pointer-events: none;
  }

  #celebration-text span {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,183,3,0.8), 0 0 40px rgba(251,133,0,0.6);
    padding: 0 20px;
    opacity: 0;
    transform: scale(0.7);
    animation: pop-in 0.6s ease forwards 0.2s;
  }

  @keyframes pop-in {
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

  <div class="layout">
    <div class="panel" id="panel">
      <h1>🏆 Turneringsbetting</h1>

      <div class="field">
        <label for="username">Välj ditt användarnamn</label>
        <input type="text" id="username" placeholder="Skriv ditt namn..." list="username-suggestions" autocomplete="off">
        <datalist id="username-suggestions"></datalist>
      </div>

      <div class="field">
        <label for="target">Vem vill du betta på</label>
        <input type="text" id="target" placeholder="Skriv ett namn..." list="target-suggestions" autocomplete="off">
        <datalist id="target-suggestions"></datalist>
      </div>

      <div class="field">
        <label for="amount">Hur mycket vill du satsa?</label>
        <div class="amount-row">
          <input type="range" id="amount" min="1" max="20" step="1" value="1">
          <div class="amount-value"><span id="amount-value">1</span> SEK</div>
        </div>
      </div>

      <button id="submit-btn" disabled>Satsa!</button>
      <p class="hint">Fyll i alla fält för att kunna satsa.</p>
    </div>

    <div class="bets-panel">
      <h2>Alla satsningar</h2>
      <table id="bets-table">
        <thead>
          <tr>
            <th>Användarnamn</th>
            <th>Bettat på</th>
            <th style="text-align:right">Summa</th>
          </tr>
        </thead>
        <tbody id="bets-body"></tbody>
      </table>
      <p class="empty-bets" id="empty-bets">Inga satsningar än.</p>
    </div>
  </div>

  <canvas id="fireworks-canvas"></canvas>
  <div id="celebration-text"><span id="celebration-message">Vad festligt, nu startar vi turneringen!</span></div>

<script>
  // Ursprungslista, används bara första gången appen öppnas i en webbläsare.
  const DEFAULT_USERNAMES = [
    "Anna", "Erik", "Johan", "Sara", "Lisa",
    "Oskar", "Emma", "Karl", "Maja", "Viktor"
  ];
  const STORAGE_KEY = "turnering-anvandarnamn";

  function loadUsernames() {
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(stored) && stored.length) return stored;
    } catch (e) {}
    return [...DEFAULT_USERNAMES];
  }

  function saveUsernames(names) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
  }

  let usernames = loadUsernames();

  const BETS_STORAGE_KEY = "turnering-satsningar";

  function loadBets() {
    try {
      const stored = JSON.parse(localStorage.getItem(BETS_STORAGE_KEY));
      if (Array.isArray(stored)) return stored;
    } catch (e) {}
    return [];
  }

  function saveBets(list) {
    localStorage.setItem(BETS_STORAGE_KEY, JSON.stringify(list));
  }

  let bets = loadBets();

  const betsBody = document.getElementById("bets-body");
  const emptyBets = document.getElementById("empty-bets");

  function renderBets() {
    betsBody.innerHTML = "";
    emptyBets.style.display = bets.length ? "none" : "block";
    bets.forEach(bet => {
      const row = document.createElement("tr");

      const usernameCell = document.createElement("td");
      usernameCell.textContent = bet.username;

      const targetCell = document.createElement("td");
      targetCell.textContent = bet.target;

      const amountCell = document.createElement("td");
      amountCell.className = "amount-cell";
      amountCell.textContent = `${bet.amount} SEK`;

      row.append(usernameCell, targetCell, amountCell);
      betsBody.appendChild(row);
    });
  }
  renderBets();

  function addBet(username, target, amount) {
    bets.push({ username, target, amount });
    saveBets(bets);
    renderBets();
  }

  const usernameInput = document.getElementById("username");
  const usernameSuggestions = document.getElementById("username-suggestions");
  const targetInput = document.getElementById("target");
  const targetSuggestions = document.getElementById("target-suggestions");
  const amountInput = document.getElementById("amount");
  const amountValue = document.getElementById("amount-value");
  const submitBtn = document.getElementById("submit-btn");

  function fillDatalist(datalist) {
    datalist.innerHTML = "";
    usernames.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      datalist.appendChild(opt);
    });
  }

  function renderUsernames() {
    fillDatalist(usernameSuggestions);
    fillDatalist(targetSuggestions);
  }
  renderUsernames();

  function addUsername(name) {
    if (!usernames.includes(name)) {
      usernames.push(name);
      saveUsernames(usernames);
      renderUsernames();
    }
  }

  function updateSubmitState() {
    const valid = usernameInput.value.trim() && targetInput.value.trim();
    submitBtn.disabled = !valid;
  }

  usernameInput.addEventListener("input", updateSubmitState);
  targetInput.addEventListener("input", updateSubmitState);

  amountInput.addEventListener("input", () => {
    amountValue.textContent = amountInput.value;
  });

  function messageForAmount(amount) {
    if (amount === 1) return "Snålis!";
    if (amount <= 14) return "Vad festligt, nu börjar turneringen!";
    return "Oj, nu får du lugna ner dig! Tänk på ekonomin.";
  }

  submitBtn.addEventListener("click", () => {
    const name = usernameInput.value.trim();
    const target = targetInput.value.trim();
    const amount = Number(amountInput.value);
    if (!name || !target) return;
    addUsername(name);
    addUsername(target);
    addBet(name, target, amount);

    const message = messageForAmount(amount);

    usernameInput.value = "";
    targetInput.value = "";
    amountInput.value = 1;
    amountValue.textContent = "1";
    updateSubmitState();

    launchCelebration(message);
  });

  // --- Fireworks ---
  const canvas = document.getElementById("fireworks-canvas");
  const ctx = canvas.getContext("2d");
  const celebrationText = document.getElementById("celebration-text");
  let particles = [];
  let animationId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);

  const colors = ["#ffb703", "#fb8500", "#8ecae6", "#219ebc", "#ff006e", "#fb5607", "#ffffff"];

  function createBurst(x, y) {
    const count = 60;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function animate() {
    ctx.fillStyle = "rgba(10, 12, 23, 0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.life -= 0.012;
    });
    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    animationId = requestAnimationFrame(animate);
  }

  function launchCelebration(message) {
    resizeCanvas();
    canvas.style.display = "block";
    celebrationText.style.display = "flex";
    const messageEl = document.getElementById("celebration-message");
    messageEl.textContent = message;
    messageEl.style.animation = "none";
    void messageEl.offsetWidth;
    messageEl.style.animation = "";

    ctx.fillStyle = "#0a0c17";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = [];
    animate();

    let bursts = 0;
    const burstInterval = setInterval(() => {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.6 + canvas.height * 0.1;
      createBurst(x, y);
      bursts++;
      if (bursts >= 8) clearInterval(burstInterval);
    }, 350);

    setTimeout(() => {
      cancelAnimationFrame(animationId);
      canvas.style.display = "none";
      celebrationText.style.display = "none";
    }, 6000);
  }
</script>
</body>
</html>
