<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turneringsbetting</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1220;
    --card: #1b1f33;
    --accent: #ffb703;
    --accent-2: #fb8500;
    --text: #f4f4f9;
    --muted: #a6a8c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e2240, #0a0c17 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 24px;
    text-align: center;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  select, input[type="range"] {
    width: 100%;
    font-size: 1rem;
  }

  select {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #3a3f5c;
    background: #262b47;
    color: var(--text);
    appearance: none;
  }

  select:focus {
    outline: 2px solid var(--accent);
  }

  .amount-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .amount-value {
    min-width: 64px;
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
  }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a1a1a;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button:not(:disabled):hover {
    transform: translateY(-2px);
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 14px;
  }

  #fireworks-canvas {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 10;
  }

  #celebration-text {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 11;
    pointer-events: none;
  }

  #celebration-text span {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,183,3,0.8), 0 0 40px rgba(251,133,0,0.6);
    padding: 0 20px;
    opacity: 0;
    transform: scale(0.7);
    animation: pop-in 0.6s ease forwards 0.2s;
  }

  @keyframes pop-in {
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

  <div class="panel" id="panel">
    <h1>🏆 Turneringsbetting</h1>

    <div class="field">
      <label for="username">Välj ditt användarnamn</label>
      <select id="username">
        <option value="" disabled selected>Välj ett namn...</option>
      </select>
    </div>

    <div class="field">
      <label for="target">Vem vill du betta på</label>
      <select id="target">
        <option value="" disabled selected>Välj ett namn...</option>
      </select>
    </div>

    <div class="field">
      <label for="amount">Hur mycket vill du satsa?</label>
      <div class="amount-row">
        <input type="range" id="amount" min="1" max="20" step="1" value="1">
        <div class="amount-value"><span id="amount-value">1</span> SEK</div>
      </div>
    </div>

    <button id="submit-btn" disabled>Satsa!</button>
    <p class="hint">Fyll i alla fält för att kunna satsa.</p>
  </div>

  <canvas id="fireworks-canvas"></canvas>
  <div id="celebration-text"><span>Vad festligt, nu startar vi turneringen!</span></div>

<script>
  // Ändra listan här för att lägga till/ta bort deltagare.
  const USERNAMES = [
    "Anna", "Erik", "Johan", "Sara", "Lisa",
    "Oskar", "Emma", "Karl", "Maja", "Viktor"
  ];

  const usernameSelect = document.getElementById("username");
  const targetSelect = document.getElementById("target");
  const amountInput = document.getElementById("amount");
  const amountValue = document.getElementById("amount-value");
  const submitBtn = document.getElementById("submit-btn");

  function fillOptions(select) {
    USERNAMES.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
  }
  fillOptions(usernameSelect);
  fillOptions(targetSelect);

  function updateSubmitState() {
    const valid = usernameSelect.value && targetSelect.value;
    submitBtn.disabled = !valid;
  }

  usernameSelect.addEventListener("change", updateSubmitState);
  targetSelect.addEventListener("change", updateSubmitState);

  amountInput.addEventListener("input", () => {
    amountValue.textContent = amountInput.value;
  });

  submitBtn.addEventListener("click", () => {
    launchCelebration();
  });

  // --- Fireworks ---
  const canvas = document.getElementById("fireworks-canvas");
  const ctx = canvas.getContext("2d");
  const celebrationText = document.getElementById("celebration-text");
  let particles = [];
  let animationId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);

  const colors = ["#ffb703", "#fb8500", "#8ecae6", "#219ebc", "#ff006e", "#fb5607", "#ffffff"];

  function createBurst(x, y) {
    const count = 60;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function animate() {
    ctx.fillStyle = "rgba(10, 12, 23, 0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.life -= 0.012;
    });
    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    animationId = requestAnimationFrame(animate);
  }

  function launchCelebration() {
    resizeCanvas();
    canvas.style.display = "block";
    celebrationText.style.display = "flex";
    celebrationText.querySelector("span").style.animation = "none";
    void celebrationText.offsetWidth;
    celebrationText.querySelector("span").style.animation = "";

    ctx.fillStyle = "#0a0c17";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = [];
    animate();

    let bursts = 0;
    const burstInterval = setInterval(() => {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.6 + canvas.height * 0.1;
      createBurst(x, y);
      bursts++;
      if (bursts >= 8) clearInterval(burstInterval);
    }, 350);

    setTimeout(() => {
      cancelAnimationFrame(animationId);
      canvas.style.display = "none";
      celebrationText.style.display = "none";
    }, 6000);
  }
</script>
</body>
</html>
