<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turneringsbetting</title>
<style>
  :root {
    color-scheme: light dark;
    --wood-light: #d9a86c;
    --wood-mid: #b5793a;
    --wood-dark: #7a4a24;
    --ring-red: #c62828;
    --ring-yellow: #f0b429;
    --card: #fbf3e3;
    --accent: #f0b429;
    --accent-2: #c62828;
    --text: #3a2415;
    --muted: #8a6d4d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--wood-mid);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
    overflow-x: hidden;
  }

  .board-bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -2;
    background: var(--wood-dark);
  }

  .title-block {
    text-align: center;
    margin-bottom: 24px;
  }

  .title-block h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.8rem;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--ring-red);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
  }

  .title-block .place {
    font-size: 0.9rem;
    margin: 4px 0 0;
    color: var(--muted);
  }

  .title-block .date {
    font-size: 0.9rem;
    margin: 2px 0 0;
    color: var(--muted);
  }

  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(122,74,36,0.25);
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  select, input[type="text"], input[type="range"] {
    width: 100%;
    font-size: 1rem;
  }

  select, input[type="text"] {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #d8c3a0;
    background: #fffdf8;
    color: var(--text);
    appearance: none;
    font-family: inherit;
  }

  select:focus, input[type="text"]:focus {
    outline: 2px solid var(--accent);
  }

  .amount-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .amount-value {
    min-width: 64px;
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent-2);
  }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #fffdf8;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button:not(:disabled):hover {
    transform: translateY(-2px);
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 14px;
  }

  .bets-panel {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
    background: var(--card);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(122,74,36,0.25);
  }

  .bets-panel h2 {
    font-size: 1.1rem;
    margin: 0 0 16px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #e6d5b8;
  }

  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
  }

  td.amount-cell {
    text-align: right;
    font-weight: 700;
    color: var(--accent-2);
  }

  .empty-bets {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 8px 0;
  }

  .remove-btn {
    padding: 4px 10px;
    border: 1px solid rgba(198,40,40,0.4);
    border-radius: 8px;
    background: transparent;
    color: var(--ring-red);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .remove-btn:hover {
    background: rgba(198,40,40,0.1);
  }

  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  #fireworks-canvas {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 10;
  }

  #celebration-text {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 11;
    pointer-events: none;
  }

  #celebration-text span {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,183,3,0.8), 0 0 40px rgba(251,133,0,0.6);
    padding: 0 20px;
    opacity: 0;
    transform: scale(0.7);
    animation: pop-in 0.6s ease forwards 0.2s;
  }

  @keyframes pop-in {
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

  <svg class="board-bg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="800" height="800" fill="#d9a86c"/>
    <rect x="40" y="40" width="720" height="720" rx="6" fill="#e3c48f"/>

    <line x1="20" y1="650" x2="140" y2="400" stroke="#f1e2c2" stroke-width="14" stroke-linecap="round"/>
    <line x1="780" y1="650" x2="660" y2="400" stroke="#f1e2c2" stroke-width="14" stroke-linecap="round"/>

    <circle cx="230" cy="140" r="20" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="230" cy="140" r="9" fill="#e3c48f"/>
    <circle cx="330" cy="110" r="18" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="330" cy="110" r="8" fill="#e3c48f"/>
    <circle cx="470" cy="190" r="19" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="470" cy="190" r="8" fill="#e3c48f"/>
    <circle cx="600" cy="230" r="20" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="600" cy="230" r="9" fill="#e3c48f"/>
    <circle cx="150" cy="300" r="18" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="150" cy="300" r="8" fill="#e3c48f"/>
    <circle cx="630" cy="330" r="19" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="630" cy="330" r="8" fill="#e3c48f"/>
    <circle cx="300" cy="430" r="20" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="300" cy="430" r="9" fill="#e3c48f"/>
    <circle cx="510" cy="400" r="18" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="510" cy="400" r="8" fill="#e3c48f"/>
    <circle cx="360" cy="480" r="19" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="360" cy="480" r="8" fill="#e3c48f"/>
    <circle cx="250" cy="570" r="20" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="250" cy="570" r="9" fill="#e3c48f"/>
    <circle cx="440" cy="570" r="18" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="440" cy="570" r="8" fill="#e3c48f"/>
    <circle cx="570" cy="550" r="19" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="570" cy="550" r="8" fill="#e3c48f"/>
    <circle cx="530" cy="620" r="20" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="530" cy="620" r="9" fill="#e3c48f"/>
    <circle cx="300" cy="660" r="18" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="300" cy="660" r="8" fill="#e3c48f"/>
    <circle cx="380" cy="670" r="17" fill="#f0b429" stroke="#b8790a" stroke-width="2"/><circle cx="380" cy="670" r="7" fill="#e3c48f"/>
    <circle cx="150" cy="620" r="19" fill="#c62828" stroke="#8f1d1d" stroke-width="2"/><circle cx="150" cy="620" r="8" fill="#e3c48f"/>

    <circle cx="90" cy="90" r="52" fill="#141414"/>
    <circle cx="710" cy="90" r="52" fill="#141414"/>
    <circle cx="90" cy="710" r="52" fill="#141414"/>
    <circle cx="710" cy="710" r="52" fill="#141414"/>

    <rect x="170" y="170" width="460" height="460" fill="none" stroke="#1c1c1c" stroke-width="4"/>
    <circle cx="170" cy="170" r="16" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <circle cx="630" cy="170" r="16" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <circle cx="170" cy="630" r="16" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <circle cx="630" cy="630" r="16" fill="none" stroke="#1c1c1c" stroke-width="3"/>

    <circle cx="400" cy="400" r="130" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <circle cx="400" cy="400" r="4" fill="#1c1c1c"/>

    <circle cx="140" cy="400" r="28" fill="#141414"/>
    <ellipse cx="132" cy="391" rx="8" ry="5" fill="#4a4a4a" opacity="0.6"/>
    <circle cx="660" cy="400" r="28" fill="#141414"/>
    <ellipse cx="652" cy="391" rx="8" ry="5" fill="#4a4a4a" opacity="0.6"/>
  </svg>

  <div class="layout">
    <div class="panel" id="panel">
      <div class="title-block">
        <h1>Couronne-turnering</h1>
        <p class="place">Nordkoster</p>
        <p class="date">1 augusti 2026</p>
      </div>

      <div class="field">
        <label for="username">Välj ditt användarnamn</label>
        <input type="text" id="username" placeholder="Skriv ditt namn..." list="username-suggestions" autocomplete="off">
        <datalist id="username-suggestions"></datalist>
      </div>

      <div class="field">
        <label for="target">Vem vill du betta på</label>
        <input type="text" id="target" placeholder="Skriv ett namn..." list="target-suggestions" autocomplete="off">
        <datalist id="target-suggestions"></datalist>
      </div>

      <div class="field">
        <label for="prediction" id="prediction-label">Jag tror att personen...</label>
        <select id="prediction">
          <option value="" disabled selected>Välj...</option>
          <option>Vinner</option>
          <option>Går till final</option>
          <option>Går till semifinal</option>
          <option>Vinner 1 match</option>
          <option>Vinner 2 matcher</option>
          <option>Vinner 3 matcher</option>
          <option>Åker ut först</option>
        </select>
      </div>

      <div class="field">
        <label for="amount">Hur mycket vill du satsa?</label>
        <div class="amount-row">
          <input type="range" id="amount" min="1" max="20" step="1" value="1">
          <div class="amount-value"><span id="amount-value">1</span> SEK</div>
        </div>
      </div>

      <button id="submit-btn" disabled>Satsa!</button>
      <p class="hint">Fyll i alla fält för att kunna satsa.</p>
    </div>

    <div class="bets-panel">
      <h2>Alla satsningar</h2>
      <table id="bets-table">
        <thead>
          <tr>
            <th>Bettare</th>
            <th>Bettat på</th>
            <th>Tror att...</th>
            <th style="text-align:right">Summa</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bets-body"></tbody>
      </table>
      <p class="empty-bets" id="empty-bets">Inga satsningar än.</p>
    </div>
  </div>

  <canvas id="fireworks-canvas"></canvas>
  <div id="celebration-text"><span id="celebration-message">Vad festligt, nu startar vi turneringen!</span></div>

<script>
  // Ursprungslista, används bara första gången appen öppnas i en webbläsare.
  const DEFAULT_USERNAMES = [
    "SamTheMan", "JullTheBull", "Mike", "MatillaTheThrilla", "LinaGrahnBästIStan",
    "NissePisséPäronpungJättegammalInteUng", "FasterFaster", "MatsiYatzi", "MiAnmore",
    "Annannannanas", "HannaBanana", "AllYouNeedIsLove", "PiancaIngrosso", "Länsman"
  ];
  const STORAGE_KEY = "turnering-anvandarnamn";

  function loadUsernames() {
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(stored) && stored.length) return stored;
    } catch (e) {}
    return [...DEFAULT_USERNAMES];
  }

  function saveUsernames(names) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
  }

  let usernames = loadUsernames();

  const BETS_STORAGE_KEY = "turnering-satsningar";

  function loadBets() {
    try {
      const stored = JSON.parse(localStorage.getItem(BETS_STORAGE_KEY));
      if (Array.isArray(stored)) return stored;
    } catch (e) {}
    return [];
  }

  function saveBets(list) {
    localStorage.setItem(BETS_STORAGE_KEY, JSON.stringify(list));
  }

  let bets = loadBets();

  const betsBody = document.getElementById("bets-body");
  const emptyBets = document.getElementById("empty-bets");

  const REMOVE_PASSWORD = "matildaärbäst";

  function renderBets() {
    betsBody.innerHTML = "";
    emptyBets.style.display = bets.length ? "none" : "block";
    bets.forEach((bet, index) => {
      const row = document.createElement("tr");

      const usernameCell = document.createElement("td");
      usernameCell.textContent = bet.username;

      const targetCell = document.createElement("td");
      targetCell.textContent = bet.target;

      const predictionCell = document.createElement("td");
      predictionCell.textContent = bet.prediction;

      const amountCell = document.createElement("td");
      amountCell.className = "amount-cell";
      amountCell.textContent = `${bet.amount} SEK`;

      const removeCell = document.createElement("td");
      removeCell.style.textAlign = "right";
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "remove-btn";
      removeBtn.textContent = "Ta bort";
      removeBtn.addEventListener("click", () => removeBet(index));
      removeCell.appendChild(removeBtn);

      row.append(usernameCell, targetCell, predictionCell, amountCell, removeCell);
      betsBody.appendChild(row);
    });
  }
  renderBets();

  function removeBet(index) {
    const password = prompt("Ange lösenord för att ta bort satsningen:");
    if (password === null) return;
    if (password !== REMOVE_PASSWORD) {
      alert("Fel lösenord.");
      return;
    }
    bets.splice(index, 1);
    saveBets(bets);
    renderBets();
  }

  function addBet(username, target, prediction, amount) {
    bets.push({ username, target, prediction, amount });
    saveBets(bets);
    renderBets();
  }

  const usernameInput = document.getElementById("username");
  const usernameSuggestions = document.getElementById("username-suggestions");
  const targetInput = document.getElementById("target");
  const targetSuggestions = document.getElementById("target-suggestions");
  const predictionSelect = document.getElementById("prediction");
  const predictionLabel = document.getElementById("prediction-label");
  const amountInput = document.getElementById("amount");
  const amountValue = document.getElementById("amount-value");
  const submitBtn = document.getElementById("submit-btn");

  function fillDatalist(datalist) {
    datalist.innerHTML = "";
    usernames.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      datalist.appendChild(opt);
    });
  }

  function renderUsernames() {
    fillDatalist(usernameSuggestions);
    fillDatalist(targetSuggestions);
  }
  renderUsernames();

  function addUsername(name) {
    if (!usernames.includes(name)) {
      usernames.push(name);
      saveUsernames(usernames);
      renderUsernames();
    }
  }

  function updatePredictionLabel() {
    const target = targetInput.value.trim();
    predictionLabel.textContent = target ? `Jag tror att ${target}...` : "Jag tror att personen...";
  }

  function updateSubmitState() {
    const valid = usernameInput.value.trim() && targetInput.value.trim() && predictionSelect.value;
    submitBtn.disabled = !valid;
  }

  usernameInput.addEventListener("input", updateSubmitState);
  targetInput.addEventListener("input", () => {
    updatePredictionLabel();
    updateSubmitState();
  });
  predictionSelect.addEventListener("change", updateSubmitState);

  amountInput.addEventListener("input", () => {
    amountValue.textContent = amountInput.value;
  });

  function messageForAmount(amount) {
    if (amount === 1) return "Snålis!";
    if (amount <= 14) return "Vad festligt, nu börjar turneringen!";
    return "Oj, nu får du lugna ner dig! Tänk på ekonomin.";
  }

  submitBtn.addEventListener("click", () => {
    const name = usernameInput.value.trim();
    const target = targetInput.value.trim();
    const prediction = predictionSelect.value;
    const amount = Number(amountInput.value);
    if (!name || !target || !prediction) return;
    addUsername(name);
    addUsername(target);
    addBet(name, target, prediction, amount);

    const message = messageForAmount(amount);

    usernameInput.value = "";
    targetInput.value = "";
    predictionSelect.value = "";
    amountInput.value = 1;
    amountValue.textContent = "1";
    updatePredictionLabel();
    updateSubmitState();

    launchCelebration(message);
  });

  // --- Fireworks ---
  const canvas = document.getElementById("fireworks-canvas");
  const ctx = canvas.getContext("2d");
  const celebrationText = document.getElementById("celebration-text");
  let particles = [];
  let animationId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);

  const colors = ["#ffb703", "#fb8500", "#8ecae6", "#219ebc", "#ff006e", "#fb5607", "#ffffff"];

  function createBurst(x, y) {
    const count = 60;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function animate() {
    ctx.fillStyle = "rgba(10, 12, 23, 0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.life -= 0.012;
    });
    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    animationId = requestAnimationFrame(animate);
  }

  function launchCelebration(message) {
    resizeCanvas();
    canvas.style.display = "block";
    celebrationText.style.display = "flex";
    const messageEl = document.getElementById("celebration-message");
    messageEl.textContent = message;
    messageEl.style.animation = "none";
    void messageEl.offsetWidth;
    messageEl.style.animation = "";

    ctx.fillStyle = "#0a0c17";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = [];
    animate();

    let bursts = 0;
    const burstInterval = setInterval(() => {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.6 + canvas.height * 0.1;
      createBurst(x, y);
      bursts++;
      if (bursts >= 8) clearInterval(burstInterval);
    }, 350);

    setTimeout(() => {
      cancelAnimationFrame(animationId);
      canvas.style.display = "none";
      celebrationText.style.display = "none";
    }, 6000);
  }
</script>
</body>
</html>
